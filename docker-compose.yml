# CORE (default):      docker compose up --build            -> postgres + api (embedded mock provider)
# OPTIONAL backups:    docker compose --profile backup run --rm backup
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions
      POSTGRES_PASSWORD: transactions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactions -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transactions
      DB_USER: transactions
      DB_PASSWORD: transactions
      SECURITY_API_KEYS: ${SECURITY_API_KEYS:-dev-key-change-me}   # override with a real secret
      PROVIDER_MOCK_ENABLED: "true"                                  # embedded mock provider
      PROVIDER_BASE_URL: http://localhost:8080
      PROVIDER_RETRY_MAX_ATTEMPTS: ${PROVIDER_RETRY_MAX_ATTEMPTS:-3} # try 1 to turn retries off
    ports:
      - "8080:8080"

  # OPTIONAL: only runs with --profile backup. One-shot logical backup into ./backups
  backup:
    profiles: ["backup"]
    image: postgres:16            # Debian variant: has bash, needed by the scripts
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: transactions
      PGPASSWORD: transactions
      PGDATABASE: transactions
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint: ["/scripts/backup.sh"]
