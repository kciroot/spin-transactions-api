# LOCAL (kind / minikube / Docker Desktop): free, no cloud. Core only; see overlays/local-full for the extras.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: transactions
resources:
  - ../../base
  - postgres.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: transactions-api
    literals:
      - DB_URL=jdbc:postgresql://postgres:5432/transactions
      - DB_USER=transactions
      - DB_PASSWORD=transactions
      - SECURITY_API_KEYS=local-k8s-key
      - PGPASSWORD=transactions
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: transactions-api
      data:
        PROVIDER_MOCK_ENABLED: "true"
        PROVIDER_BASE_URL: "http://localhost:8080"
        SPRINGDOC_ENABLED: "true"
        PGHOST: "postgres"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: transactions-api
      spec:
        replicas: 2
        template:
          spec:
            initContainers:
              - name: wait-for-postgres
                image: busybox:1.36
                command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
            containers:
              - name: api
                resources:
                  requests: { cpu: 200m, memory: 384Mi }
                  limits: { memory: 640Mi }
