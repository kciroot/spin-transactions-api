# LOCAL DEMO ONLY: throw-away PostgreSQL (data lives in an emptyDir). Never use this in a real environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: transactions
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: transactions }
            - { name: POSTGRES_USER, value: transactions }
            - { name: POSTGRES_PASSWORD, value: transactions }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "transactions", "-d", "transactions"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: transactions
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
