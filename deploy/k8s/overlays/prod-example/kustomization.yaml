# PRODUCTION EXAMPLE (never applied by the demo). External managed PostgreSQL, real secret created out of band.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: transactions
resources:
  - ../../base
components:
  - ../../components/autoscaling
  - ../../components/network-policy
  - ../../components/backup
# secret.example.yaml is intentionally NOT listed: create the real Secret with External Secrets / Sealed Secrets / Vault.
images:
  - name: transactions-api
    newName: registry.example.com/transactions-api   # your registry
    newTag: "1.0.0"
