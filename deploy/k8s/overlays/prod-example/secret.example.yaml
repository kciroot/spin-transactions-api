# EXAMPLE ONLY. Do not commit real values: create it from your secret manager
# (External Secrets, Sealed Secrets, Vault...) or with: kubectl create secret generic transactions-api ...
apiVersion: v1
kind: Secret
metadata:
  name: transactions-api
  namespace: transactions
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://postgres.example.internal:5432/transactions"
  DB_USER: "transactions"
  DB_PASSWORD: "change-me"
  SECURITY_API_KEYS: "change-me-key-1"          # comma separated to rotate without downtime
  PGPASSWORD: "change-me"                       # used by the backup CronJob
