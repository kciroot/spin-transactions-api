# Zero-dependency profile: in-memory H2 (PostgreSQL mode) + embedded mock provider.
spring:
  datasource:
    url: jdbc:h2:mem:transactions;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

provider:
  mock:
    enabled: true

security:
  api-keys:
    - local-dev-key
